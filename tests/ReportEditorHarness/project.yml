name: ReportEditorHarness
options:
  bundleIdPrefix: link.galaxy.report-editor-test
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  ReportEditorHarness:
    type: application
    platform: iOS
    sources:
      - Host.swift
      - ../../GalaxyBluetooth/DiscordReports.swift
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  ReportEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ReportEditorUITests.swift
    dependencies:
      - target: ReportEditorHarness
schemes:
  ReportEditorHarness:
    build:
      targets:
        ReportEditorHarness: all
        ReportEditorUITests: [test]
    test:
      targets: [ReportEditorUITests]
