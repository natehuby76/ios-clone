name: Sentry integration review
on:
  push:
    branches: [review/sentry-native-push]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh ci_scripts/ci_post_clone.sh
      - if: always()
        run: python3 tests/check_sentry_push.py
      - if: always()
        run: xcodebuild -project GalaxyBluetooth.xcodeproj -scheme GalaxyBluetooth -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  comma:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: natehuby76/StarPilotBT
          ref: a72bccf3d87cba363b56abfbe5449619ea8ed9f4
          sparse-checkout: |
            openpilot/starpilot
            openpilot/common
            openpilot/cereal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9' requests cryptography 'pycapnp==2.1.0' opendbc numpy zstandard
      - run: python -m pytest -q openpilot/starpilot/sentry_mode/tests/test_relay_enrollment.py openpilot/starpilot/sentry_mode/tests/test_notifications.py
