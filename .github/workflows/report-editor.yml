name: Native report editor
on:
  push:
    branches: [research/carplay-app-only]
    paths:
      - GalaxyBluetooth/DiscordReports.swift
      - tests/ReportEditorHarness/**
      - .github/workflows/report-editor.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify report snapshot and upload budget
        run: python3 tests/check_report_budget.py
      - name: Generate isolated host for the actual report sheet
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec tests/ReportEditorHarness/project.yml
      - name: Verify editing and keyboard visibility on iPhone
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -project tests/ReportEditorHarness/ReportEditorHarness.xcodeproj \
            -scheme ReportEditorHarness -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO -destination-timeout 90 \
            -resultBundlePath /tmp/report-editor.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export report editor screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path /tmp/report-editor.xcresult --output-path /tmp/report-editor-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-editor-result
          path: |
            /tmp/report-editor.xcresult
            /tmp/report-editor-screenshots
